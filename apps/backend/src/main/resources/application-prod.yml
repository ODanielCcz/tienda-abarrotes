spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}

server:
  forward-headers-strategy: framework

management:
  health:
    redis:
      enabled: true
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis

logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
    com.odcc.tienda: INFO

app:
  security:
    login-rate-limit:
      provider: redis
      key-secret-base64: ${RATE_LIMIT_KEY_SECRET_BASE64:}
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
