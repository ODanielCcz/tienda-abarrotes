<h2 mat-dialog-title>{{ data.profile ? 'Editar emisor fiscal' : 'Nuevo emisor fiscal' }}</h2>
<mat-dialog-content
  ><form id="issuer-form" [formGroup]="form" (ngSubmit)="submit()">
    <mat-form-field appearance="outline"
      ><mat-label>Sucursal</mat-label
      ><mat-select formControlName="branchId">
        @for (branch of data.branches; track branch.branchId) {
          <mat-option [value]="branch.branchId" [disabled]="branch.status !== 'ACTIVE'">{{
            branch.name
          }}</mat-option>
        }
      </mat-select></mat-form-field
    >
    <mat-form-field appearance="outline"
      ><mat-label>RFC</mat-label><input matInput formControlName="rfc" maxlength="13"
    /></mat-form-field>
    <mat-form-field appearance="outline" class="wide"
      ><mat-label>Razón social</mat-label
      ><input matInput formControlName="legalName" maxlength="300"
    /></mat-form-field>
    <mat-form-field appearance="outline"
      ><mat-label>Código postal</mat-label
      ><input matInput formControlName="postalCode" maxlength="5" inputmode="numeric"
    /></mat-form-field>
    <mat-form-field appearance="outline"
      ><mat-label>Régimen fiscal SAT</mat-label
      ><input matInput formControlName="fiscalRegimeCode" maxlength="5"
    /></mat-form-field>
    <mat-form-field appearance="outline"
      ><mat-label>Serie predeterminada</mat-label
      ><input matInput formControlName="defaultSeries" maxlength="25"
    /></mat-form-field>
  </form>
  @if (errorMessage()) {
    <p class="error-state" role="alert">{{ errorMessage() }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end"
  ><button mat-button [mat-dialog-close]="null">Cancelar</button
  ><button
    mat-flat-button
    type="submit"
    form="issuer-form"
    [disabled]="form.invalid || submitting()"
  >
    Guardar
  </button></mat-dialog-actions
>
