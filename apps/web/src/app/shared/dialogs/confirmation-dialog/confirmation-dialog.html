<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" data-testid="cancel" (click)="close(false)">Cancelar</button>
  <button mat-flat-button type="button" data-testid="confirm" (click)="close(true)">
    {{ data.confirmLabel || 'Confirmar' }}
  </button>
</mat-dialog-actions>
