name: Dependency Graph

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-graph:
    name: Generate pull request dependency graph
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate dependency graph artifact
        uses: gradle/actions/dependency-submission@16f3e46a58d2b926c34615132d7969a96bccb22b # v6.0.0
        with:
          build-root-directory: apps/backend
          dependency-graph: generate-and-upload
          artifact-retention-days: 1
          validate-wrappers: true

  main-graph:
    name: Submit main dependency graph
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@16f3e46a58d2b926c34615132d7969a96bccb22b # v6.0.0
        with:
          build-root-directory: apps/backend
          dependency-graph: generate-and-submit
          validate-wrappers: true
