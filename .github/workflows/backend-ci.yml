name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend, migrations and container
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: tienda-abarrotes-ci-${{ github.run_id }}
      COMPOSE_ENV_FILE: .ci/compose.env
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Create isolated Compose environment
        shell: bash
        run: |
          mkdir -p .ci
          cat > "$COMPOSE_ENV_FILE" <<EOF
          POSTGRES_DB=tienda_ci
          POSTGRES_USER=tienda_owner
          POSTGRES_PASSWORD=$(openssl rand -hex 32)
          REDIS_PASSWORD=$(openssl rand -hex 32)
          POSTGRES_PORT=55433
          BACKEND_PORT=58080
          JWT_SECRET_BASE64=$(openssl rand -base64 48 | tr -d '\n')
          BOOTSTRAP_ADMIN_ENABLED=false
          PGADMIN_DEFAULT_PASSWORD=$(openssl rand -hex 32)
          EOF

      - name: Build PostgreSQL image for Testcontainers
        shell: bash
        run: docker compose --env-file "$COMPOSE_ENV_FILE" build database

      - name: Run backend test suite
        working-directory: apps/backend
        run: bash ./gradlew test --no-daemon

      - name: Build backend jar
        working-directory: apps/backend
        run: bash ./gradlew bootJar --no-daemon

      - name: Apply and validate Flyway migrations
        shell: bash
        run: |
          docker compose --env-file "$COMPOSE_ENV_FILE" up -d database
          docker compose --env-file "$COMPOSE_ENV_FILE" --profile migrate run --rm flyway migrate
          docker compose --env-file "$COMPOSE_ENV_FILE" --profile migrate run --rm flyway validate
          expected=$(find database/migrations -maxdepth 1 -type f -name 'V*__*.sql' -printf '%f\n' \
            | sed -E 's/^V([0-9]+)__.*/\1/' | sort -n | tail -1)
          actual=$(docker compose --env-file "$COMPOSE_ENV_FILE" exec -T database \
            psql -U tienda_owner -d tienda_ci -Atc \
            "SELECT version FROM flyway_schema_history WHERE success ORDER BY installed_rank DESC LIMIT 1;")
          test "$((10#$actual))" -eq "$((10#$expected))"

      - name: Build and smoke-test backend image
        shell: bash
        run: |
          docker compose --env-file "$COMPOSE_ENV_FILE" build backend
          docker compose --env-file "$COMPOSE_ENV_FILE" up -d backend
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://localhost:58080/actuator/health | grep -q '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file "$COMPOSE_ENV_FILE" logs backend --tail=200
          exit 1

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: tienda-backend:local
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Upload Gradle test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-reports
          path: |
            apps/backend/build/reports/tests/test
            apps/backend/build/test-results/test
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up isolated services
        if: always()
        shell: bash
        run: |
          if [ -f "$COMPOSE_ENV_FILE" ]; then
            docker compose --env-file "$COMPOSE_ENV_FILE" down -v --remove-orphans
          fi
