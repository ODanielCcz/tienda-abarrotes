name: tienda-perf

services:
  database:
    image: tienda-perf-postgres:18.6-pgaudit18.0
    command: !override
      - postgres
      - -c
      - shared_preload_libraries=pgaudit,pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=250ms
      - -c
      - pgaudit.log=role,ddl
      - -c
      - pgaudit.log_statement=off
      - -c
      - pgaudit.log_parameter=off
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-55434}:5432"
    restart: "no"

  redis:
    restart: "no"

  backend:
    image: tienda-perf-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: local,redis,performance
      LOGIN_RATE_LIMIT_PROVIDER: redis
      LOGIN_RATE_LIMIT_UNAVAILABLE_RETRY_AFTER: ${LOGIN_RATE_LIMIT_UNAVAILABLE_RETRY_AFTER:-PT5S}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-20}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-5}
      TRACING_SAMPLING_PROBABILITY: "0.0"
      JWT_ISSUER: ${JWT_ISSUER:-tienda-abarrotes-performance}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT4H}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrador de rendimiento}
      API_MAX_JSON_PAYLOAD_BYTES: ${API_MAX_JSON_PAYLOAD_BYTES:-1048576}
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-58081}:8080"
    restart: "no"

  web-performance:
    image: nginx:1.29.4-alpine
    profiles: [performance]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PERF_WEB_PORT:-54201}:80"
    volumes:
      - ./apps/web/dist/tienda-web/browser:/usr/share/nginx/html:ro
      - ./tests/performance/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: "no"
    networks: [tienda_data]

  k6:
    image: grafana/k6:1.3.0
    profiles: [performance]
    depends_on:
      backend:
        condition: service_healthy
    working_dir: /work
    environment:
      BASE_URL: http://backend:8080
      PERF_USERNAME: ${PERF_USERNAME:?Define PERF_USERNAME in perf.env}
      PERF_PASSWORD: ${PERF_PASSWORD:?Define PERF_PASSWORD in perf.env}
    volumes:
      - type: bind
        source: ./tests/performance/k6
        target: /work
        read_only: true
      - type: bind
        source: ./tests/performance/fixtures
        target: /fixtures
        read_only: true
      - type: bind
        source: ${PERF_ARTIFACTS_DIR}
        target: /artifacts
    networks: [tienda_data]
